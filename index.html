<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 2: MindAR + A-Frame Image Tracking</title>

    <!-- Подключение A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Подключение MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- AR сцена с трекингом изображений -->
    <a-scene
        mindar-image="imageTargetSrc: targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Загрузка 3D модели -->
        <a-assets>
            <a-asset-item id="astronaut" src="assets/RobotExpressive.glb"></a-asset-item>
        </a-assets>

        <!-- Камера -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Целевой маркер (targetIndex: 0 - первый маркер) -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- 3D модель астронавта -->
            <a-gltf-model
                src="#astronaut"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.01 0.01 0.01">
            </a-gltf-model>

            <!-- Освещение сцены -->
            <a-light type="ambient" color="#FFFFFF" intensity="0.8"></a-light>
            <a-light type="directional" position="1 2 1" intensity="0.6" color="#FFFFFF"></a-light>
            <a-light type="point" position="0 2 0" intensity="0.5" color="#FFFFFF"></a-light>

        </a-entity>
    </a-scene>
</body>
</html>
